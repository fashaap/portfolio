name: Deploy React Vite TS to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    
    steps:
    - name: Get latest code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        
    - name: Install dependencies
      run: npm install
      
    - name: Build project
      run: npm run build
      
    - name: Sync files to cPanel
      uses: AfonsoMatos/FTP-Deploy-Action@v1.2.0
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local_dir: ./dist # Folder hasil build Vite
        remote_dir: ./     # Root folder di cPanel Anda
        passive: true      # Memaksa mode pasif agar menembus firewall shared hosting
