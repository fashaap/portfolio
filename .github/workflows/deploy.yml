name: Deploy React Vite TS to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    
    steps:
    - name: Get latest code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24 # Menggunakan Node 24 agar error peringatan hilang
        
    - name: Install dependencies
      run: npm install
      
    - name: Build project
      run: npm run build
      
    - name: Sync files to cPanel
      uses: sebastianpopp/ftp-action@v2.0.0
      with:
        host: ${{ secrets.FTP_SERVER }}
        user: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        localDir: 'dist' # Folder hasil build proyek Vite Anda
        remoteDir: '.' # Mengarah langsung ke root folder subdomain/domain Anda
        forcePasv: true # Memaksa mode pasif agar menembus firewall shared hosting
