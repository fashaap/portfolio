name: Deploy React Vite TS to cPanel via Git
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build-and-deploy:
    name: Build and Push to Deploy Branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build project
        run: npm run build

      - name: Add cPanel deployment script
        run: |
          cat > dist/.cpanel.yml << 'EOF'
          ---
          deployment:
            tasks:
              - export DEPLOYPATH=/home/stelmfvh/fashaazhidev.my.id/fasha/
              - /bin/cp -R * $DEPLOYPATH
          EOF

      - name: Push build output to "deploy" branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.ACCESS_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          force_orphan: true
