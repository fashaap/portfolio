name: Deploy React Vite TS to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      # pakai npm ci untuk reproducible install, fallback ke npm install jika lockfile tidak ada
      run: |
        if [ -f package-lock.json ]; then npm ci; else npm install; fi

    - name: Build project
      run: npm run build

    - name: "Debug: show node & directory contents"
      run: |
        echo "Working directory: $(pwd)"
        node -v
        npm -v
        echo "Repository root listing:"
        ls -la
        echo "Project listing:"
        ls -la .
        echo "Contents of dist (if exists):"
        ls -la dist || echo "dist not found"
        du -sh dist || true
        echo "--- End of debug ---"

    - name: Verify FTP secrets are present
      shell: bash
      run: |
        if [ -z "${{ secrets.FTP_USERNAME }}" ] || [ -z "${{ secrets.FTP_SERVER }}" ] || [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
          echo "::error::Missing one or more required secrets: FTP_USERNAME, FTP_SERVER, FTP_PASSWORD"
          exit 1
        fi
        echo "All required secrets present."

    - name: Sync files to cPanel via SFTP
      uses: wlixcc/SFTP-Deploy-Action@v1.2.4
      with:
        username: ${{ secrets.FTP_USERNAME }}
        host: ${{ secrets.FTP_SERVER }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 22
        local_path: './dist'                    # gunakan folder, bukan glob
        remote_path: '/home/stelmfvh/fashaazhidev.my.id/fasha'  # path yang kamu berikan